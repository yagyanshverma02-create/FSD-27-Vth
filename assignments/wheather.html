<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <style>
        table{
            width: 80%;
            margin: auto;
            padding: 10px;
            font-size: 20px;
            color:aqua;
            border: 2px solid rgb(0, 0, 0);
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>
                    so.no
                </th>
                <th>CITY</th>
                <th>Image</th>
                <th>Today's Weather is</th>
                
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL="";
        async function wheather(){
            try{
                const res= awaitfetch(URL);
                const data=await res.json();
                console.log("Data=",data.wheather);
                let row="";
                data.wheather.map((i,index)=>{
                    row+=
                    
                    `<tr>
                        <td>${index+1}</td>
                        <td>${i.CITY}</td>
                        <td><img src="${i.images[0]}" alt="${i.title}" width="100px"></td>
                        <td>${i.Today's Weather is}</td>
                    </tr>
                    `;
                    ele.innerHTML=row;

                })

            }
            catch(err){
                console.log("ERROR",err);
                ele.innerHTML=`<tr>Network error</tr>`;
            }
        }
        wheather();
    </script>
</body>
</html>
